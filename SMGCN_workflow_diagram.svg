<svg width="800" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .start-end { fill: #FFE4B5; stroke: #D2691E; stroke-width: 2; }
      .process { fill: #ADD8E6; stroke: #4682B4; stroke-width: 2; }
      .output { fill: #FFB6C1; stroke: #DC143C; stroke-width: 2; }
      .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; dominant-baseline: middle; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .side-arrow { stroke: #DC143C; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" class="title">SMGCN 项目流程图</text>
  
  <!-- Start -->
  <ellipse cx="400" cy="80" rx="60" ry="25" class="start-end"/>
  <text x="400" y="80" class="text">开始</text>
  
  <!-- Data Loading -->
  <rect x="320" y="130" width="160" height="40" rx="5" class="process"/>
  <text x="400" y="150" class="text">数据加载和预处理</text>
  
  <!-- Side output: Symptoms and Herbs -->
  <rect x="550" y="130" width="120" height="40" rx="5" class="output"/>
  <text x="610" y="145" class="text">症状集合和</text>
  <text x="610" y="155" class="text">草药集合</text>
  
  <!-- Arrow from data loading to side output -->
  <line x1="480" y1="150" x2="550" y2="150" class="side-arrow"/>
  
  <!-- Graph Construction -->
  <rect x="320" y="200" width="160" height="40" rx="5" class="process"/>
  <text x="400" y="220" class="text">图结构构建</text>
  
  <!-- Hypergraph Construction -->
  <rect x="320" y="270" width="160" height="40" rx="5" class="process"/>
  <text x="400" y="290" class="text">超图构建</text>
  
  <!-- Model Initialization -->
  <rect x="320" y="340" width="160" height="40" rx="5" class="process"/>
  <text x="400" y="360" class="text">SMGCN模型初始化</text>
  
  <!-- Embedding Learning -->
  <rect x="320" y="410" width="160" height="40" rx="5" class="process"/>
  <text x="400" y="430" class="text">嵌入表示学习</text>
  
  <!-- Contrastive Learning -->
  <rect x="320" y="480" width="160" height="40" rx="5" class="process"/>
  <text x="400" y="500" class="text">对比学习训练</text>
  
  <!-- Side output: Enhanced Embeddings -->
  <rect x="550" y="480" width="120" height="40" rx="5" class="output"/>
  <text x="610" y="495" class="text">增强的症状</text>
  <text x="610" y="505" class="text">草药嵌入</text>
  
  <!-- Arrow from contrastive learning to side output -->
  <line x1="480" y1="500" x2="550" y2="500" class="side-arrow"/>
  
  <!-- Loss Computation -->
  <rect x="320" y="550" width="160" height="40" rx="5" class="process"/>
  <text x="400" y="570" class="text">损失函数计算</text>
  
  <!-- Model Optimization -->
  <rect x="320" y="620" width="160" height="40" rx="5" class="process"/>
  <text x="400" y="640" class="text">模型参数优化</text>
  
  <!-- Model Evaluation -->
  <rect x="320" y="690" width="160" height="40" rx="5" class="process"/>
  <text x="400" y="710" class="text">模型评估</text>
  
  <!-- Side output: Evaluation Metrics -->
  <rect x="550" y="690" width="120" height="40" rx="5" class="output"/>
  <text x="610" y="705" class="text">评估指标</text>
  <text x="610" y="715" class="text">(Recall, NDCG等)</text>
  
  <!-- Arrow from model evaluation to side output -->
  <line x1="480" y1="710" x2="550" y2="710" class="side-arrow"/>
  
  <!-- Prescription Generation -->
  <rect x="320" y="760" width="160" height="40" rx="5" class="process"/>
  <text x="400" y="780" class="text">处方生成预测</text>
  
  <!-- Side output: Recommended Herbs -->
  <rect x="550" y="760" width="120" height="40" rx="5" class="output"/>
  <text x="610" y="775" class="text">推荐的</text>
  <text x="610" y="785" class="text">草药组合</text>
  
  <!-- Arrow from prescription generation to side output -->
  <line x1="480" y1="780" x2="550" y2="780" class="side-arrow"/>
  
  <!-- Results Saving -->
  <rect x="320" y="830" width="160" height="40" rx="5" class="process"/>
  <text x="400" y="850" class="text">结果保存</text>
  
  <!-- End -->
  <ellipse cx="400" cy="920" rx="60" ry="25" class="start-end"/>
  <text x="400" y="920" class="text">结束</text>
  
  <!-- Main flow arrows -->
  <line x1="400" y1="105" x2="400" y2="130" class="arrow"/>
  <line x1="400" y1="170" x2="400" y2="200" class="arrow"/>
  <line x1="400" y1="240" x2="400" y2="270" class="arrow"/>
  <line x1="400" y1="310" x2="400" y2="340" class="arrow"/>
  <line x1="400" y1="380" x2="400" y2="410" class="arrow"/>
  <line x1="400" y1="450" x2="400" y2="480" class="arrow"/>
  <line x1="400" y1="520" x2="400" y2="550" class="arrow"/>
  <line x1="400" y1="590" x2="400" y2="620" class="arrow"/>
  <line x1="400" y1="660" x2="400" y2="690" class="arrow"/>
  <line x1="400" y1="730" x2="400" y2="760" class="arrow"/>
  <line x1="400" y1="800" x2="400" y2="830" class="arrow"/>
  <line x1="400" y1="870" x2="400" y2="895" class="arrow"/>
  
  <!-- Additional components -->
  <text x="100" y="150" class="text" style="font-size: 10px;">• train.txt</text>
  <text x="100" y="165" class="text" style="font-size: 10px;">• test.txt</text>
  <text x="100" y="180" class="text" style="font-size: 10px;">• symPair.txt</text>
  <text x="100" y="195" class="text" style="font-size: 10px;">• herbPair.txt</text>
  
  <text x="100" y="220" class="text" style="font-size: 10px;">• 邻接矩阵</text>
  <text x="100" y="235" class="text" style="font-size: 10px;">• 对称关系图</text>
  
  <text x="100" y="290" class="text" style="font-size: 10px;">• 超图邻接矩阵</text>
  <text x="100" y="305" class="text" style="font-size: 10px;">• 拉普拉斯矩阵</text>
  
  <text x="100" y="360" class="text" style="font-size: 10px;">• GCN层</text>
  <text x="100" y="375" class="text" style="font-size: 10px;">• MLP预测层</text>
  
  <text x="100" y="430" class="text" style="font-size: 10px;">• 用户嵌入</text>
  <text x="100" y="445" class="text" style="font-size: 10px;">• 物品嵌入</text>
  
  <text x="100" y="500" class="text" style="font-size: 10px;">• 超图对比学习</text>
  <text x="100" y="515" class="text" style="font-size: 10px;">• 温度参数调节</text>
  
  <text x="100" y="570" class="text" style="font-size: 10px;">• BPR损失</text>
  <text x="100" y="585" class="text" style="font-size: 10px;">• 对比学习损失</text>
  
  <text x="100" y="640" class="text" style="font-size: 10px;">• Adam优化器</text>
  <text x="100" y="655" class="text" style="font-size: 10px;">• 学习率调度</text>
  
  <text x="100" y="710" class="text" style="font-size: 10px;">• Recall@K</text>
  <text x="100" y="725" class="text" style="font-size: 10px;">• NDCG@K</text>
  
  <text x="100" y="780" class="text" style="font-size: 10px;">• Top-K推荐</text>
  <text x="100" y="795" class="text" style="font-size: 10px;">• 相似度计算</text>
  
  <text x="100" y="850" class="text" style="font-size: 10px;">• 模型权重</text>
  <text x="100" y="865" class="text" style="font-size: 10px;">• 评估结果</text>
</svg>